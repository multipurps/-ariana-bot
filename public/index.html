<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ariana">
<meta name="theme-color" content="#000000">
<title>Ariana</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<script src="/socket.io/socket.io.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;
  --s1:rgba(255,255,255,0.04);
  --s2:rgba(255,255,255,0.08);
  --s3:rgba(255,255,255,0.12);
  --b1:rgba(255,255,255,0.07);
  --b2:rgba(255,255,255,0.11);
  --t1:#fff;
  --t2:rgba(255,255,255,0.45);
  --t3:rgba(255,255,255,0.22);
  --sent:rgba(37,211,102,0.16);
  --sent-b:rgba(37,211,102,0.28);
  --recv:rgba(255,255,255,0.07);
  --recv-b:rgba(255,255,255,0.11);
  --wa:#25D366;
  --tg:#2AABEE;
  --sms:#34C759;
  --acc:#25D366;
  --danger:#ef4444;
  --blur:blur(28px) saturate(200%);
}
html,body{
  height:100%;height:100dvh;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,textarea{font-family:inherit;color:inherit}

/* ── APP ── */
#app{display:flex;height:100vh;height:100dvh;position:relative;overflow:hidden}

/* ── LEFT ── */
#left{
  width:360px;min-width:360px;
  display:flex;flex-direction:column;
  background:rgba(8,8,8,0.98);
  border-right:1px solid var(--b1);
  z-index:10;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}

/* Header */
#left-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:rgba(0,0,0,0.7);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--b1);
  min-height:60px;
}
.hdr-title{font-size:22px;font-weight:700;letter-spacing:-.4px}
.hdr-icons{display:flex;gap:4px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--t2);transition:background .15s,color .15s;
}
.icon-btn:active{background:var(--s2);color:#fff}
.icon-btn svg{width:20px;height:20px}

/* Platform Tabs */
#platform-tabs{
  display:flex;gap:6px;padding:10px 12px;
  background:rgba(0,0,0,0.5);
  border-bottom:1px solid var(--b1);
  overflow-x:auto;flex-shrink:0;
}
#platform-tabs::-webkit-scrollbar{display:none}
.ptab{
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:20px;
  font-size:13px;font-weight:600;
  color:var(--t2);
  background:transparent;border:1px solid transparent;
  transition:all .2s;white-space:nowrap;flex-shrink:0;
}
.ptab svg{width:15px;height:15px;flex-shrink:0}
.ptab.active{color:#fff;background:var(--s2);border-color:var(--b2)}
.ptab.active.wa{color:var(--wa);background:rgba(37,211,102,0.1);border-color:rgba(37,211,102,0.3)}
.ptab.active.tg{color:var(--tg);background:rgba(42,171,238,0.1);border-color:rgba(42,171,238,0.3)}
.ptab.active.sms{color:var(--sms);background:rgba(52,199,89,0.1);border-color:rgba(52,199,89,0.3)}
.ptab-count{
  background:var(--danger);color:#fff;
  border-radius:8px;padding:0 5px;
  font-size:10px;font-weight:700;min-width:16px;
  text-align:center;display:none;
}
.ptab-count.show{display:inline-block}

/* Search */
#search-bar{padding:8px 12px;background:rgba(0,0,0,0.3);flex-shrink:0}
#search-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border-radius:10px;
  padding:0 12px;border:1px solid var(--b1);
}
#search-wrap svg{flex-shrink:0;color:var(--t2);width:16px;height:16px}
#search-input{
  flex:1;background:none;border:none;outline:none;
  padding:9px 0;font-size:15px;color:#fff;
}
#search-input::placeholder{color:var(--t3)}

/* Contact list */
#contact-list{flex:1;overflow-y:auto}
#contact-list::-webkit-scrollbar{width:0}

.contact-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.03);
  transition:background .1s;position:relative;
}
.contact-item.active,.contact-item:active{background:rgba(255,255,255,0.06)}

.c-av{
  width:50px;height:50px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;position:relative;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.1);
  overflow:visible;
}
.c-av-inner{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.c-av-inner img{width:100%;height:100%;object-fit:cover}
.plat-dot{
  position:absolute;bottom:-1px;right:-1px;
  width:18px;height:18px;border-radius:50%;
  border:2px solid #000;
  display:flex;align-items:center;justify-content:center;
}
.plat-dot.wa{background:#075E54}
.plat-dot.tg{background:#17212b}
.plat-dot.sms{background:#1c1c1e}
.plat-dot svg{width:9px;height:9px}

.c-info{flex:1;min-width:0}
.c-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.c-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:195px}
.c-time{font-size:11px;color:var(--t2);flex-shrink:0}
.c-time.u{color:var(--wa)}
.c-bot{display:flex;align-items:center;gap:5px}
.c-prev{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.c-prev.am::before{content:"🌸 ";font-size:11px}
.c-prev.ym::before{content:"You: ";color:var(--t3)}
.badge{
  background:var(--wa);color:#000;border-radius:10px;
  min-width:20px;height:20px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex-shrink:0;
}
.badge.tb{background:var(--danger);color:#fff}

/* ── RIGHT ── */
#right{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000}

/* No chat */
#no-chat{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;color:var(--t2);padding:40px;
}
.nc-flower{font-size:60px;opacity:.4;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#no-chat h2{font-size:22px;font-weight:300;color:#fff;letter-spacing:-.3px}
#no-chat p{font-size:14px;text-align:center;max-width:280px;line-height:1.7}

/* Chat header */
#chat-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(0,0,0,0.85);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--b1);
  min-height:58px;z-index:2;position:relative;flex-shrink:0;
}
#chat-back{
  font-size:28px;padding:0 4px 0 0;
  display:none;color:var(--wa);font-weight:300;line-height:1;
}
#chat-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;cursor:pointer;overflow:hidden;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.15);
}
#chat-avatar img{width:100%;height:100%;object-fit:cover}
#chat-info{flex:1;min-width:0;cursor:pointer}
#chat-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-sub{font-size:12px;color:var(--t2)}
#chat-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
#send-as-wrap{
  display:flex;background:rgba(255,255,255,0.07);
  border-radius:20px;padding:3px;gap:2px;
  border:1px solid var(--b1);
}
.sa-btn{padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700;color:var(--t2);transition:all .2s}
.sa-btn.active{background:var(--wa);color:#000}
.sa-btn.active.takeover{background:var(--danger);color:#fff}

/* Messages */
#messages{
  flex:1;overflow-y:auto;padding:14px 5%;
  display:flex;flex-direction:column;gap:2px;
}
#messages::-webkit-scrollbar{width:0}

.msg-wrap{display:flex;flex-direction:column;margin:1px 0}
.msg-wrap.in{align-self:flex-start;max-width:78%}
.msg-wrap.out{align-self:flex-end;max-width:78%}

.bubble{
  padding:8px 12px 6px;
  font-size:15px;line-height:1.45;word-break:break-word;
  position:relative;min-width:72px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.msg-wrap.in .bubble{
  background:var(--recv);border:1px solid var(--recv-b);
  border-radius:18px 18px 18px 4px;
}
.msg-wrap.out .bubble{
  background:var(--sent);border:1px solid var(--sent-b);
  border-radius:18px 18px 4px 18px;
}
.bubble-footer{
  display:flex;align-items:center;justify-content:flex-end;
  gap:3px;margin-top:3px;
}
.btime{font-size:11px;color:rgba(255,255,255,0.38);white-space:nowrap}
.msg-wrap.in .btime{color:var(--t2)}
.ticks{display:flex;align-items:center}
.tick-line{
  width:8px;height:1.5px;background:rgba(255,255,255,0.35);
  border-radius:1px;display:inline-block;
  transform-origin:left center;
}
/* Simple checkmark ticks */
.tick{font-size:12px;color:rgba(255,255,255,0.4);line-height:1}
.tick.read{color:#53bdeb}

.msg-sender{font-size:12px;font-weight:600;margin-bottom:3px;padding:0 2px}
.msg-sender.ariana{color:rgba(201,125,224,0.85)}
.msg-sender.you{color:rgba(83,189,235,0.85)}

.date-div{
  align-self:center;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--b1);
  color:var(--t2);font-size:12px;
  padding:4px 12px;border-radius:10px;
  margin:8px 0;
}

/* Input */
#input-area{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,0.9);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--b1);
  min-height:62px;z-index:2;position:relative;flex-shrink:0;
}
#takeover-notice{
  display:none;position:absolute;top:-34px;left:0;right:0;
  background:rgba(239,68,68,.92);color:#fff;
  font-size:12px;font-weight:700;
  padding:8px 16px;text-align:center;z-index:5;
  letter-spacing:.3px;
}
#takeover-notice.show{display:block}
.inp-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--b1);
  color:var(--t2);font-size:20px;
  transition:background .15s,color .15s;
}
.inp-btn:active{background:var(--s3);color:#fff}
.inp-btn svg{width:20px;height:20px}
#msg-box{
  flex:1;background:rgba(255,255,255,0.07);
  border:1px solid var(--b1);border-radius:22px;
  padding:10px 16px;font-size:15px;outline:none;
  color:#fff;resize:none;max-height:120px;line-height:1.4;
}
#msg-box::placeholder{color:var(--t3)}
#send-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--wa);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .1s;
}
#send-btn:active{transform:scale(.9)}
#send-btn.takeover-mode{background:var(--danger)}
#send-btn svg{width:18px;height:18px;fill:#000}

/* Emoji picker */
#emoji-picker{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(10,10,10,0.98);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--b1);
  z-index:5;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#emoji-picker.open{transform:translateY(0)}
.emoji-cats{
  display:flex;padding:8px 10px 4px;
  border-bottom:1px solid var(--b1);gap:2px;
}
.ecbtn{
  padding:7px 10px;border-radius:8px;font-size:18px;
  transition:background .12s;
}
.ecbtn.active{background:rgba(255,255,255,0.1)}
.emoji-grid{
  display:grid;grid-template-columns:repeat(8,1fr);
  gap:2px;padding:8px 8px 14px;
  max-height:190px;overflow-y:auto;
}
.emoji-grid::-webkit-scrollbar{display:none}
.ebtn{
  font-size:22px;padding:5px;border-radius:8px;
  text-align:center;cursor:pointer;
  transition:background .1s;
  user-select:none;
}
.ebtn:active{background:rgba(255,255,255,0.12)}

/* Modals */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:100;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.modal-overlay.hidden{display:none}
.modal{
  background:rgba(18,18,18,0.98);border:1px solid var(--b2);
  border-radius:20px;padding:24px;width:340px;max-width:90vw;
}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px}
.modal-input{
  width:100%;background:rgba(255,255,255,0.08);border:1px solid var(--b2);
  border-radius:10px;padding:12px 14px;font-size:15px;
  color:#fff;outline:none;margin-bottom:12px;
}
.modal-input::placeholder{color:var(--t3)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.mbtn{padding:9px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.mbtn.cancel{color:var(--wa);background:none}
.mbtn.confirm{background:var(--wa);color:#000}
.mbtn.danger{background:var(--danger);color:#fff}

/* Wallpaper modal */
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.wp-thumb{
  aspect-ratio:9/16;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:border-color .2s;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:rgba(255,255,255,.4);
}
.wp-thumb.active{border-color:var(--wa)}

/* Contact drawer */
#contact-drawer{
  position:absolute;top:0;right:-370px;width:360px;height:100%;
  background:rgba(10,10,10,0.99);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-left:1px solid var(--b1);
  z-index:50;transition:right .3s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;display:flex;flex-direction:column;
}
#contact-drawer.open{right:0}
.drawer-hdr{
  background:rgba(0,0,0,0.6);
  padding:20px 16px 16px;
  padding-top:calc(20px + env(safe-area-inset-top));
  border-bottom:1px solid var(--b1);
}
.drawer-av{
  width:88px;height:88px;border-radius:50%;
  background:rgba(255,255,255,0.1);border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:42px;margin:0 auto 12px;cursor:pointer;
  overflow:hidden;position:relative;
}
.drawer-av img{width:100%;height:100%;object-fit:cover}
.av-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;opacity:0;transition:opacity .2s;border-radius:50%;
}
.drawer-av:hover .av-overlay{opacity:1}
.drawer-dname{font-size:20px;font-weight:600;text-align:center;margin-bottom:4px}
.drawer-phone{font-size:13px;color:var(--t2);text-align:center}
.drawer-body{padding:14px;flex:1}
.dsec{
  background:rgba(255,255,255,0.05);border:1px solid var(--b1);
  border-radius:14px;padding:14px;margin-bottom:10px;
}
.dsec h4{font-size:11px;color:var(--wa);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.drow{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);
}
.drow:last-child{border:none}
.dlabel{font-size:14px;color:var(--t2)}
.dval{font-size:14px}
.toggle{position:relative;width:44px;height:26px}
.toggle input{opacity:0;width:0;height:0}
.tslider{
  position:absolute;inset:0;background:#333;border-radius:26px;
  cursor:pointer;transition:.3s;
}
.tslider::before{
  content:"";position:absolute;left:3px;top:3px;
  width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s;
}
.toggle input:checked+.tslider{background:var(--wa)}
.toggle input:checked+.tslider::before{transform:translateX(18px)}
.daction{
  width:100%;padding:12px;border-radius:12px;
  font-size:14px;font-weight:600;text-align:center;
  cursor:pointer;margin-bottom:8px;
  border:1px solid;
}
.daction.danger{background:rgba(239,68,68,.1);color:var(--danger);border-color:rgba(239,68,68,.2)}
.daction.primary{background:rgba(37,211,102,.1);color:var(--wa);border-color:rgba(37,211,102,.2)}

/* Platform selector in drawer */
.plat-row{display:flex;gap:8px;margin-top:10px}
.plat-opt{
  flex:1;padding:8px;border-radius:10px;border:1px solid var(--b1);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;color:var(--t2);cursor:pointer;transition:all .2s;
}
.plat-opt svg{width:18px;height:18px}
.plat-opt.active.wa{border-color:rgba(37,211,102,.4);background:rgba(37,211,102,.1);color:var(--wa)}
.plat-opt.active.tg{border-color:rgba(42,171,238,.4);background:rgba(42,171,238,.1);color:var(--tg)}
.plat-opt.active.sms{border-color:rgba(52,199,89,.4);background:rgba(52,199,89,.1);color:var(--sms)}

/* Toast */
#toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,0.95);border:1px solid var(--b2);
  color:#fff;border-radius:10px;padding:10px 18px;
  font-size:13px;opacity:0;transition:all .25s;
  z-index:200;white-space:nowrap;pointer-events:none;
  max-width:88vw;text-overflow:ellipsis;overflow:hidden;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MOBILE */
@media(max-width:700px){
  #left{position:absolute;inset:0;z-index:20;width:100%;min-width:unset}
  #left.hidden{transform:translateX(-100%)}
  #right{width:100%}
  #chat-back{display:flex !important}
  #chat-header{padding-left:6px}
  #contact-drawer{width:100%;right:-100%}
  #messages{padding:12px 4%}
}
</style>
</head>
<body>
<div id="app">

<!-- LEFT -->
<div id="left">
  <div id="left-header">
    <span class="hdr-title">🌸 Ariana</span>
    <div class="hdr-icons">
      <button class="icon-btn" onclick="openWallpaperModal()" title="Wallpaper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </button>
      <button class="icon-btn" id="notif-btn" onclick="requestPush()" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="icon-btn" onclick="showToast('Webhook active')">

function showEcat(cat,btn){
  document.querySelectorAll(".ecbtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const grid=document.getElementById("emoji-grid");
  grid.innerHTML=EMOJIS[cat].map(e=>`<div class="ebtn" onclick="insertEmoji('${e}')">${e}</div>`).join("");
}
function initEmoji(){
  showEcat("smileys",document.querySelector(".ecbtn"));
}

  emojiOpen=!emojiOpen;
  document.getElementById("emoji-picker").classList.toggle("open",emojiOpen);
  if(emojiOpen) initEmoji();
}
function insertEmoji(e){
  const box=document.getElementById("msg-box");
  const s=box.selectionStart,end=box.selectionEnd;
  box.value=box.value.slice(0,s)+e+box.value.slice(end);
  box.selectionStart=box.selectionEnd=s+e.length;
  box.focus();
  autoResize(box);
}

/* ── ATTACHMENT ── */
function handleAttach(e){
  const file=e.target.files[0];
  if(!file||!currentPhone) return;
  showToast("Attachment: "+file.name+" (sending not yet wired)");
  e.target.value="";
}

/* ── PUSH ── */
async function requestPush(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)){showToast("Push not supported");return;}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){showToast("Notification permission denied");return;}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    pushSubscription=sub;
    await fetch("/api/push-subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)});
    showToast("Notifications enabled");
  }catch(e){showToast("Push failed: "+e.message);}
}
function urlBase64ToUint8Array(b64){
  const pad="=".repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

  if(!currentPhone) return;

  const p=getContactPlatform(currentPhone);

    if(el.classList.contains(p)) el.classList.add("active");

}

}

/* ── SOCKET ── */
socket.on("init",({conversations,takenOver})=>{
  takenOverSet=new Set(takenOver);
  conversations.forEach(c=>convos[c.phone]=c);
  renderList();
});
socket.on("new_message",({phone,msg,convo})=>{
  convos[phone]=convo;
  if(!convos[phone]._unread) convos[phone]._unread=0;
  if(phone===currentPhone){appendMsg(msg);scrollBottom();}
  else{convos[phone]._unread++;showToast((convos[phone].name||phone)+": "+msg.text.slice(0,40));}
  renderList();
});
socket.on("takeover_update",({phone,active})=>{
  if(active) takenOverSet.add(phone); else takenOverSet.delete(phone);
  if(convos[phone]) convos[phone].takenOver=active;
  if(phone===currentPhone) updateTakeoverUI();
  renderList();
});
socket.on("rename",({phone,name})=>{
  if(convos[phone]) convos[phone].name=name;
  renderList();
  if(phone===currentPhone){document.getElementById("chat-name").textContent=name;updateDrawer();}
});

/* ── CONTACT LIST ── */
function renderList(){
  const q=document.getElementById("search-input").value.toLowerCase();
  const list=Object.values(convos).filter(c=>{
    const n=(c.name||c.phone).toLowerCase();
    if(q&&!n.includes(q)) return false;
    if(activePlatTab!=="all"&&getContactPlatform(c.phone)!==activePlatTab) return false;
    return true;
  }).sort((a,b)=>new Date(b.lastSeen)-new Date(a.lastSeen));

  document.getElementById("contact-list").innerHTML=list.map(c=>{
    const last=c.messages?.[c.messages.length-1];
    const preview=last?last.text.slice(0,42)+(last.text.length>42?"…"):"";
    const prevClass=last?.role==="ariana"?"am":last?.role==="you"?"ym":"";
    const isTakeover=takenOverSet.has(c.phone);
    const isActive=c.phone===currentPhone;
    const init=(c.name||c.phone)[0].toUpperCase();
    const time=last?fmtTime(last.time):"";
    const unread=c._unread||0;
    const avSrc=avatars[c.phone];
    const plat=getContactPlatform(c.phone);
    return `<div class="contact-item${isActive?" active":""}" onclick="openChat('${c.phone}')">
      <div class="c-av">
        <div class="c-av-inner">${avSrc?`<img src="${avSrc}" alt="">`:init}</div>
        <div class="plat-dot ${plat}">${platSVG(plat)}</div>
      </div>
      <div class="c-info">
        <div class="c-top">
          <span class="c-name">${esc(c.name||c.phone)}</span>
          <span class="c-time${unread?" u":""}">${time}</span>
        </div>
        <div class="c-bot">
          <span class="c-prev ${prevClass}">${esc(preview)}</span>
          ${unread?`<span class="badge${isTakeover?" tb":""}">${unread}</span>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

function filterContacts(){renderList()}

/* ── OPEN/CLOSE CHAT ── */
function openChat(phone){
  currentPhone=phone;
  const c=convos[phone];
  if(c) c._unread=0;
  document.getElementById("no-chat").style.display="none";
  document.getElementById("chat-header").style.display="flex";
  document.getElementById("messages").style.display="flex";
  document.getElementById("input-area").style.display="flex";
  updateChatAvatar(phone);
  document.getElementById("chat-name").textContent=c?.name||phone;
  document.getElementById("chat-sub").textContent=c?.name?phone:"";
  const msgs=document.getElementById("messages");
  msgs.innerHTML="";
  let lastDate="";
  (c?.messages||[]).forEach(m=>{
    const d=new Date(m.time).toDateString();
    if(d!==lastDate){msgs.innerHTML+=`<div class="date-div">${fmtDate(m.time)}</div>`;lastDate=d;}
    msgs.innerHTML+=buildBubble(m);
  });
  scrollBottom();
  updateTakeoverUI();
  applyWallpaper();
  renderList();
  if(window.innerWidth<=700) document.getElementById("left").classList.add("hidden");
  if(emojiOpen){emojiOpen=false;document.getElementById("emoji-picker").classList.remove("open")}
}

function closeChat(){
  currentPhone=null;
  document.getElementById("no-chat").style.display="flex";
  document.getElementById("chat-header").style.display="none";
  document.getElementById("messages").style.display="none";
  document.getElementById("input-area").style.display="none";
  document.getElementById("left").classList.remove("hidden");
  closeDrawer();
  if(emojiOpen){emojiOpen=false;document.getElementById("emoji-picker").classList.remove("open")}
}

/* ── BUBBLES ── */
function buildBubble(msg){
  const isIn=msg.role==="user";
  const isAriana=msg.role==="ariana";
  const dir=isIn?"in":"out";
  const senderTag=isAriana?'<div class="msg-sender ariana">🌸 Ariana</div>':
    msg.role==="you"?'<div class="msg-sender you">You</div>':"";
  const ticks=!isIn?`<span class="tick">✓✓</span>`:"";
  return `<div class="msg-wrap ${dir}">
    ${senderTag}
    <div class="bubble">
      ${esc(msg.text).replace(/\n/g,"<br>")}
      <div class="bubble-footer">
        <span class="btime">${fmtTimeFull(msg.time)}</span>
        ${ticks}
      </div>
    </div>
  </div>`;
}

function appendMsg(msg){
  const msgs=document.getElementById("messages");
  const wrap=document.createElement("div");
  wrap.innerHTML=buildBubble(msg);
  msgs.appendChild(wrap.firstElementChild);
}
function scrollBottom(){const m=document.getElementById("messages");m.scrollTop=m.scrollHeight}

/* ── SEND ── */
function setSendAs(as){
  sendAs=as;
  document.getElementById("sa-ariana").classList.toggle("active",as==="ariana");
  document.getElementById("sa-you").classList.toggle("active",as==="you");
  document.getElementById("sa-you").classList.toggle("takeover",as==="you");
  document.getElementById("send-btn").classList.toggle("takeover-mode",as==="you");
}
async function sendMsg(){
  if(!currentPhone) return;
  const box=document.getElementById("msg-box");
  const text=box.value.trim();
  if(!text) return;
  box.value="";box.style.height="auto";
  if(emojiOpen){emojiOpen=false;document.getElementById("emoji-picker").classList.remove("open")}
  await fetch(`/api/send/${encodeURIComponent(currentPhone)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,as:sendAs})
  });
}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px"}

/* ── TAKEOVER ── */
async function toggleTakeover(){
  if(!currentPhone) return;
  const active=!takenOverSet.has(currentPhone);
  await fetch(`/api/takeover/${encodeURIComponent(currentPhone)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({active})
  });
}
async function toggleTakeoverFromDrawer(){
  if(!currentPhone) return;
  const active=document.getElementById("drawer-takeover-toggle").checked;
  await fetch(`/api/takeover/${encodeURIComponent(currentPhone)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({active})
  });
}
function updateTakeoverUI(){
  if(!currentPhone) return;
  const on=takenOverSet.has(currentPhone);
  document.getElementById("takeover-notice").classList.toggle("show",on);
  document.getElementById("drawer-takeover-toggle").checked=on;
  if(on) setSendAs("you"); else setSendAs("ariana");
}

/* ── DRAWER ── */
function openDrawer(){
  if(!currentPhone) return;
  document.getElementById("contact-drawer").classList.add("open");
  updateDrawer();
}
function closeDrawer(){document.getElementById("contact-drawer").classList.remove("open")}
function updateDrawer(){
  const c=convos[currentPhone];if(!c) return;
  document.getElementById("drawer-name").textContent=c.name||currentPhone;
  document.getElementById("drawer-phone").textContent=currentPhone;
  document.getElementById("drawer-msg-count").textContent=c.messages?.length||0;
  const msgs=c.messages||[];
  document.getElementById("drawer-first").textContent=msgs[0]?fmtDate(msgs[0].time):"—";
  document.getElementById("drawer-last").textContent=msgs[msgs.length-1]?fmtDate(msgs[msgs.length-1].time):"—";
  document.getElementById("drawer-takeover-toggle").checked=takenOverSet.has(currentPhone);
  const avEl=document.getElementById("drawer-av-img");
  if(avatars[currentPhone]){avEl.innerHTML=`<img src="${avatars[currentPhone]}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`}
  else{avEl.textContent=(c.name||currentPhone)[0].toUpperCase()}
  updatePlatformOptUI();
}

/* ── AVATAR ── */
function triggerAvatarUpload(){document.getElementById("avatar-file-input").click()}
function handleAvatarUpload(e){
  const file=e.target.files[0];if(!file||!currentPhone) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    avatars[currentPhone]=ev.target.result;
    localStorage.setItem("ariana_avatars",JSON.stringify(avatars));
    updateChatAvatar(currentPhone);updateDrawer();renderList();
    showToast("Photo updated");
  };
  reader.readAsDataURL(file);e.target.value="";
}
function updateChatAvatar(phone){
  const el=document.getElementById("chat-avatar");const c=convos[phone];
  if(avatars[phone]){el.innerHTML=`<img src="${avatars[phone]}" alt="">`}
  else{el.textContent=(c?.name||phone)[0].toUpperCase()}
}

/* ── RENAME ── */
function renameFromDrawer(){
  document.getElementById("rename-input").value=convos[currentPhone]?.name||"";
  document.getElementById("rename-modal").classList.remove("hidden");
  setTimeout(()=>document.getElementById("rename-input").focus(),100);
}
async function submitRename(){
  if(!currentPhone) return;
  const name=document.getElementById("rename-input").value.trim();
  if(!name) return;
  await fetch(`/api/rename/${encodeURIComponent(currentPhone)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})
  });
  closeModal("rename-modal");
}
function closeModal(id){document.getElementById(id).classList.add("hidden")}

/* ── WALLPAPER ── */
function buildWallpaperGrid(){
  const grid=document.getElementById("wp-grid");
  grid.innerHTML=WALLPAPERS.map(w=>`
    <div class="wp-thumb${wallpaper===w.id?" active":""}"
         style="background:${w.bg}" onclick="setWallpaper('${w.id}','${w.bg}')">
      <span>${w.label}</span>
    </div>`).join("");
}
function setWallpaper(id,bg){
  wallpaper=id;
  localStorage.setItem("ariana_wallpaper",id);
  localStorage.setItem("ariana_wallpaper_bg",bg);
  applyWallpaper();buildWallpaperGrid();
}
function applyWallpaper(){
  const msgs=document.getElementById("messages");
  const saved=localStorage.getItem("ariana_wallpaper_bg");
  if(saved&&wallpaper!=="wp-default") msgs.style.background=saved;
  else msgs.style.background="#000";
}
function handleWpUpload(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{setWallpaper("wp-custom",`url(${ev.target.result})`);showToast("Wallpaper set")};
  reader.readAsDataURL(file);
}
function openWallpaperModal(){buildWallpaperGrid();document.getElementById("wallpaper-modal").classList.remove("hidden")}
function closeWallpaperModal(){document.getElementById("wallpaper-modal").classList.add("hidden")}

/* ── IOS SWIPE BACK ── */
let touchStartX=0,touchStartY=0;
document.addEventListener("touchstart",e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=Math.abs(e.changedTouches[0].clientY-touchStartY);
  if(touchStartX<35&&dx>65&&dy<80&&currentPhone&&window.innerWidth<=700) closeChat();
},{passive:true});

/* ── UTILS ── */
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtTime(iso){
  if(!iso) return "";
  const d=new Date(iso),now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const diff=(now-d)/864e5;
  if(diff<7) return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  return d.toLocaleDateString([],{month:"numeric",day:"numeric"});
}
function fmtTimeFull(iso){if(!iso) return "";return new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function fmtDate(iso){
  if(!iso) return "—";
  const d=new Date(iso),now=new Date();
  if(d.toDateString()===now.toDateString()) return "Today";
  if(new Date(now-864e5).toDateString()===d.toDateString()) return "Yesterday";
  return d.toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"});
}
let toastT;
function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),3000);
}

const urlP=new URLSearchParams(location.search);
if(urlP.get("chat")){
  const ph=urlP.get("chat");
  socket.on("init",()=>{if(convos[ph]) openChat(ph)});
}
</script>
